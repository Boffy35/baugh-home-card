<style>
.edge { stroke:#9ff6ff; stroke-width:.8; fill:none; stroke-linecap:round; }
.thin { stroke:#22e4ff; stroke-opacity:.4; stroke-width:.6; }
.hid  { stroke:#22e4ff; stroke-opacity:.35; stroke-width:.5; stroke-dasharray:1.5 1.5; }
.scan { stroke:#22e4ff; stroke-opacity:.14; stroke-width:.35; }
#glowLayer .edge { stroke:#22e4ff; stroke-width:2.4; stroke-opacity:.6; }
.flow { stroke-dasharray:.02 .015; animation: flow 1.2s linear infinite; }
@keyframes flow { to { stroke-dashoffset:-.035; } }
.sweep { animation: sweep 2.6s linear infinite; }
@keyframes sweep { from { transform: translateY(0); } to { transform: translateY(-0.62px); } }
.flicker { animation: flicker 7s steps(1) infinite; }
@keyframes flicker { 0%,100% { opacity:1 } 33% { opacity:.85 } 34% { opacity:1 } 81% { opacity:.9 } 82% { opacity:1 } }
@media (prefers-reduced-motion: reduce) { .sweep, .flicker, .flow { animation: none; } }
