.scan { stroke:#22e4ff; stroke-opacity:.14; stroke-width:.35; }
#glowLayer .edge { stroke:#22e4ff; stroke-width:2.4; stroke-opacity:.6; }
.sweep { animation: sweep 3.2s linear infinite; }
@keyframes sweep { from { transform: translateY(0); } to { transform: translateY(-0.96px); } }
.flicker { animation: flicker 6s steps(1) infinite; }
@keyframes flicker { 0%,100% { opacity:1 } 47% { opacity:.82 } 48% { opacity:1 } 71% { opacity:.9 } 72% { opacity:1 } }
@media (prefers-reduced-motion: reduce) { .sweep, .flicker { animation: none; } }
